name: CI
on:
  pull_request:
  push:
    branches: [ccr-2a8d97cf-nbzebl]
permissions:
  contents: read
jobs:
  seguridad-y-pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Solo falla con avisos críticos en lo que se ejecuta en producción (los altos de la cadena de compilación se revisan a mano).
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx playwright install --with-deps chromium
      # La prueba que vigila la fantasía (REGLA DE ORO) y la seguridad de las rutas públicas.
      - run: npm run test:e2e -- magia pin metricas correo
