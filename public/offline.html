<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0f4a">
<title>Sin conexión · Línea Mágica</title>
<style>
  html,body{margin:0;height:100%;background:#120822;color:#fff6dc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#4a1a80 0%,#2a0f4a 45%,#120822 100%)}
  main{max-width:22rem}
  .star{font-size:56px;line-height:1;filter:drop-shadow(0 0 18px rgba(246,215,122,.7))}
  h1{margin:.4em 0 .2em;font-size:26px;color:#f6d77a}
  p{margin:.4em 0;line-height:1.5;color:rgba(255,246,220,.8)}
  button{margin-top:18px;min-height:48px;padding:0 28px;border:0;border-radius:16px;background:linear-gradient(#f6d77a,#d9a23a);color:#2a0f4a;font-weight:700;font-size:16px}
</style>
</head>
<body>
<main>
  <div class="star" aria-hidden="true">✨</div>
  <h1>Se ha cortado la línea mágica</h1>
  <p>No hay conexión ahora mismo. En cuanto vuelva, todo seguirá donde lo dejaste: los mensajes están a salvo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
