<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a0f4a">
<title>Sin conexión · Línea Mágica</title>
<style>
  html,body{margin:0;height:100%;background:#120822;color:#fff6dc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#4a1a80 0%,#2a0f4a 45%,#120822 100%)}
  main{max-width:22rem}
  .logo{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  h1{margin:.4em 0 .2em;font-size:26px;color:#f6d77a}
  p{margin:.4em 0;line-height:1.5;color:rgba(255,246,220,.8)}
  button{margin-top:18px;min-height:48px;padding:0 28px;border:0;border-radius:16px;background:linear-gradient(#f6d77a,#d9a23a);color:#2a0f4a;font-weight:700;font-size:16px}
</style>
</head>
<body>
<main>
  <img class="logo" src="/icons/icon-192.png" alt="" width="88" height="88">
  <h1>Vaya, no hay conexión</h1>
  <p>Parece que el móvil se ha quedado sin internet un momento. No se ha perdido nada: en cuanto vuelva la conexión, todo seguirá donde lo dejaste.</p>
  <button type="button" onclick="location.reload()">Volver a intentarlo</button>
  <script>addEventListener('online',function(){location.reload()});setTimeout(function(){if(navigator.onLine)location.reload()},8000)</script>
</main>
</body>
</html>
